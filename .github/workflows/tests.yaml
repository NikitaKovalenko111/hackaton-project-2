name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET}}
        GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
        FRONTEND_ORIGIN: http://localhost:3000
        NEXT_PUBLIC_BACKEND_API: http://localhost:3001
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444

    steps:
    - uses: actions/checkout@v4  # ⬅️ обновил

    - name: Setup Python
      uses: actions/setup-python@v5  # ⬅️ обновил
      with:
            python-version: '3.9'

    - name: Install python dependencies
      run: pip install -r requirements.txt

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install npm dependencies
      run: |
          npm install -g concurrently
          npm install
          npm run install

    - name: building project
      run: npm run build

    - name: Run server
      run: |
          npm run start:dev &
          sleep 60  
          curl -f http://localhost:3000 || exit 1

    - name: Run tests
      run: |
        pwd
        ls -la
        pytest  --alluredir=./${{ secrets.ALLURE_DIR }}
        echo "Checking allure-results directory:"
        ls -la ./${{ secrets.ALLURE_DIR }}/
        find ./${{ secrets.ALLURE_DIR }} -type f | head -10

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ${{ secrets.ALLURE_DIR }}/
        retention-days: 1

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: ./${{ secrets.ALLURE_DIR }}

    - name: Setup Java
      uses: actions/setup-java@v4  # ⬅️ обновил
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure CLI
      run: |
        sudo wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        sudo tar -zxvf allure-2.24.0.tgz -C /opt/
        sudo ln -s /opt/allure-2.24.0/bin/allure /usr/bin/allure

    - name: Generate Allure report
      run: |
        # Проверяем есть ли результаты
        if [ -d "${{ secrets.ALLURE_DIR }}" ] && [ "$(ls -A ${{ secrets.ALLURE_DIR }})" ]; then
          echo "Generating Allure report..."
          allure generate ${{ secrets.ALLURE_DIR }} -o ${{ secrets.ALLURE_REPORT }} --clean
        else
          echo "No test results, creating empty report"
          mkdir -p ${{ secrets.ALLURE_REPORT }}
          echo '<html><body><h1>No test results available</h1></body></html>' > allure-report/index.html
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: './${{ secrets.ALLURE_REPORT }}'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4