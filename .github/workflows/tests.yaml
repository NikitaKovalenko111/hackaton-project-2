name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: postgres
        DB_PASSWORD: 123456
        DB_NAME: postgres
        JWT_ACCESS_SECRET: F57cdRCyYNKLTXt3qCuJ
        JWT_REFRESH_SECRET: KyJLbjwriPv7Df7qdzDT
        GIGACHAT_AUTHORIZATION_KEY: MDE5YTM5NDctNGYyNC03MjZhLWFmNDktMTk1MjIzMTE3M2RiOmM2YTEwNzQ5LWQ3MzItNDBjZS04MjZkLTI4MDhkNjExOWNjMQ==
        FRONTEND_ORIGIN: http://localhost:3000
        NEXT_PUBLIC_BACKEND_API: http://localhost:3001
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444

    steps:
    - uses: actions/checkout@v4  # ⬅️ обновил

    - name: Setup Python
      uses: actions/setup-python@v5  # ⬅️ обновил
      with:
            python-version: '3.9'

    - name: Install python dependencies
      run: pip install -r requirements.txt

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install npm dependencies
      run: |
          npm install -g concurrently
          npm install
          npm run install

    - name: building project
      run: npm run build

    - name: Run server
      run: |
          npm run start:dev &
          sleep 60  
          curl -f http://localhost:3000 || exit 1

    - name: Run tests
      run: pytest --alluredir=allure-results

    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 1

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        name: allure-results

    - name: Setup Java
      uses: actions/setup-java@v4  # ⬅️ обновил
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure CLI
      run: |
        sudo wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        sudo tar -zxvf allure-2.24.0.tgz -C /opt/
        sudo ln -s /opt/allure-2.24.0/bin/allure /usr/bin/allure

    - name: Generate Allure report
      run: |
        # Проверяем есть ли результаты
        if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
          echo "Generating Allure report..."
          allure generate allure-results -o allure-report --clean
        else
          echo "No test results, creating empty report"
          mkdir -p allure-report
          echo '<html><body><h1>No test results available</h1></body></html>' > allure-report/index.html
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: './allure-report'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4